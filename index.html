<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Paint App</title>
    <link rel="stylesheet" href="paint.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="toolbar">
            <div class="tool-group">
                <label for="color-picker" class="tool-label">Warna</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="color-picker" value="#0f172a" />
                </div>
            </div>

            <div class="divider"></div>

            <div class="tool-group">
                <label for="brush-size" class="tool-label">Ukuran Kuas: <span id="size-val">5</span>px</label>
                <input type="range" id="brush-size" min="1" max="50" value="5" />
            </div>

            <div class="divider"></div>

            <div class="actions">
                <button id="clear-button" class="btn btn-icon" title="Bersihkan Kanvas">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        <line x1="10" y1="11" x2="10" y2="17"></line>
                        <line x1="14" y1="11" x2="14" y2="17"></line>
                    </svg>
                </button>
                <button id="fill-button" class="btn btn-icon" title="Isi Latar Belakang">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"></path>
                    </svg>
                </button>
                <button id="download-button" class="btn btn-primary">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                    Download
                </button>
            </div>
        </header>

        <main class="canvas-container">
            <canvas id="board" width="800" height="500"></canvas>
        </main>
    </div>
    <script src="paint.js"></script>
</body>
</html>
